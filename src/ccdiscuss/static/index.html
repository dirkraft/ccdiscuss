<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Discuss</title>
  <link rel="stylesheet" href="vendor/hljs-github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="vendor/hljs-github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/purify.min.js"></script>
</head>
<body>
  <header>
    <span class="hint">
      Select text, then <kbd data-keys="⌘⌥M">⌘⌥M</kbd> to comment.
      <b>Comment</b> <kbd data-keys="⌘↩">⌘↩</kbd> sends now and Claude replies in the thread;
      <b>Stage</b> <kbd data-keys="⌥↩">⌥↩</kbd> holds it to send with the rest.
      Close the window when you're done.
    </span>
    <span id="deaf" hidden>
      Claude isn't watching for comments. New ones wait here; ask in the
      terminal to resume the discussion and they'll go through.
    </span>
    <span id="batch" hidden>
      <span id="batch-count"></span>
      <button id="send-all">Send staged &amp; close</button>
    </span>
  </header>
  <main id="layout">
    <article id="doc" class="md"></article>
    <aside id="margin"></aside>
  </main>
  <button id="add-comment" hidden>Comment</button>
  <script src="app.js"></script>
</body>
</html>
